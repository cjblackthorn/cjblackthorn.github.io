name: Prevent new secrets in Field Notes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed site
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan current tracked files without publishing matches
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/current-tree" "$RUNNER_TEMP/gitleaks"
          # Archive HEAD so prior-history findings remain a separate investigation.
          # This gate checks the current tracked tree, not every PR commit.
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/current-tree"
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/current-tree:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/results" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --no-banner --redact=100 --log-level error \
            --report-format json --report-path /results/findings.json \
            >"$RUNNER_TEMP/gitleaks/private.log" 2>&1
          code=$?
          set -e
          SCAN_CODE="$code" python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          code = int(os.environ["SCAN_CODE"])
          report = Path(os.environ["RUNNER_TEMP"]) / "gitleaks" / "findings.json"
          if code not in (0, 1):
              print("::error title=Current-tree scan incomplete::Scanner failed. No clean claim can be made.")
              sys.exit(2)
          if report.exists():
              try:
                  matches = json.loads(report.read_text(encoding="utf-8"))
                  if matches is None:
                      matches = []
                  if not isinstance(matches, list):
                      raise ValueError("Unexpected report format")
              except Exception:
                  print("::error title=Current-tree scan incomplete::Scanner report invalid.")
                  sys.exit(2)
          elif code == 1:
              print("::error title=Current-tree scan incomplete::Findings indicated but report unavailable.")
              sys.exit(2)
          else:
              matches = []
          if code == 1 or matches:
              print("::error title=Potential secret in current tracked files::Investigate privately and rotate any active credential. No match details were published.")
              sys.exit(1)
          print("PASS: Current tracked tree has no Gitleaks v8.30.1 matches under configured signatures. Full Git history has a separate unresolved finding.")
          PY
